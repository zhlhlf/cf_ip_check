name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        id: vars
        run: |
          short_sha="${GITHUB_SHA::8}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform binaries in Docker
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e VERSION="${{ steps.vars.outputs.short_sha }}" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            golang:1.22-bookworm \
            sh -c '
              set -eu
              mkdir -p dist
              targets="
                windows/amd64/.exe
                windows/arm64/.exe
                linux/amd64/
                linux/arm64/
                darwin/amd64/
                darwin/arm64/
              "
              for target in $targets; do
                goos=$(echo "$target" | cut -d/ -f1)
                goarch=$(echo "$target" | cut -d/ -f2)
                ext=$(echo "$target" | cut -d/ -f3)
                name="cfip-${goos}-${goarch}${ext}"
                echo "Building $name"
                CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
                  -buildvcs=false \
                  -trimpath \
                  -ldflags "-s -w -X main.version=${VERSION}" \
                  -o "dist/$name" .
              done
            '

      - name: Stage release assets
        run: |
          # 容器已用 --user 身份运行, 正常情况下 dist 就属于当前用户;
          # 兜底处理旧产物遗留的 root 权限
          chown -R "$(id -u):$(id -g)" dist 2>/dev/null || true
          # cf.env.example 已由 go:embed 编进二进制, 这里额外附一份方便直接查看
          cp cf.env.example dist/cf.env.example
          cp README.md dist/README.md
          cd dist && zip -q "cfip-${SHORT_SHA}.zip" cfip-* cf.env.example README.md && ls -lh
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.vars.outputs.short_sha }}
          name: Release ${{ steps.vars.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## 使用方法

            1. 下载对应平台的 `cfip-<os>-<arch>`
            2. 直接运行, 首次运行会自动生成 `cf.env`:
               ```bash
               chmod +x cfip-linux-amd64
               ./cfip-linux-amd64
               ```
               默认是纯 TCP 模式, 无需任何配置。
            3. 编辑生成的 `cf.env`, 填写 `PASSWORD`、`HOST`、`PORT`、`XRAY_BIN`
               后重跑, 即切换到 TLS+WS 探测 + 隧道测速:
               ```bash
               ./cfip-linux-amd64
               ```
            4. 想把结果写回 clash 配置, 在 `cf.env` 里设置 `CLASH_YML=/path/to/config.yml`,
               程序会改写该文件 `proxies` 段前 16 个节点的 IP。

            `cf.env` 含节点密码, 已在 `.gitignore` 中忽略, 请勿提交。

            版本: `${{ steps.vars.outputs.short_sha }}` (`./cfip -version` 可查看)
          files: |
            dist/cfip-linux-*
            dist/cfip-darwin-*
            dist/cfip-windows-*
            dist/cf.env.example
            dist/README.md
            dist/cfip-*.zip
