name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        id: vars
        run: |
          short_sha="${GITHUB_SHA::8}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform binaries in Docker
        run: |
          docker run --rm \
            -e VERSION="${{ steps.vars.outputs.short_sha }}" \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            golang:1.22-bookworm \
            sh -c '
              set -eu
              mkdir -p dist
              targets="
                windows/amd64/.exe
                windows/arm64/.exe
                linux/amd64/
                linux/arm64/
                darwin/amd64/
                darwin/arm64/
              "
              for target in $targets; do
                goos=$(echo "$target" | cut -d/ -f1)
                goarch=$(echo "$target" | cut -d/ -f2)
                ext=$(echo "$target" | cut -d/ -f3)
                name="cfip-${goos}-${goarch}${ext}"
                echo "Building $name"
                CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
                  -buildvcs=false \
                  -trimpath \
                  -ldflags "-s -w -X main.version=${VERSION}" \
                  -o "dist/$name" .
              done
            '

      # 把配置模板和说明一起放进 dist, 下载后解压即用
      - name: Stage release assets
        run: |
          cp cf.env.example dist/cf.env.example
          cp README.md dist/README.md
          cd dist && zip -q "cfip-${SHORT_SHA}.zip" cfip-* cf.env.example README.md && ls -lh
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.vars.outputs.short_sha }}
          name: Release ${{ steps.vars.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## 使用方法

            1. 下载对应平台的 `cfip-<os>-<arch>`
            2. 复制配置模板并填写自己的节点信息:
               ```bash
               cp cf.env.example cf.env
               # 编辑 cf.env, 至少填 SNI、PORT、PASSWORD、XRAY_BIN
               ```
            3. 运行:
               ```bash
               chmod +x cfip-linux-amd64
               ./cfip-linux-amd64 -apply
               ```

            `cf.env` 含节点密码, 已在 `.gitignore` 中忽略, 请勿提交。

            版本: `${{ steps.vars.outputs.short_sha }}` (`./cfip -version` 可查看)
          files: |
            dist/cfip-linux-*
            dist/cfip-darwin-*
            dist/cfip-windows-*
            dist/cf.env.example
            dist/README.md
            dist/cfip-*.zip
